<html>
    <head>
        <title>Самостоятельная работа</title>
    </head>
    <body>
        <form action="#" method="post">

            <fieldset>
                <legend>Данные пользователя:</legend>
                
                <label>Имя: <input type="text" name="name" size="30" /></label><br /><br />
                
                <label>Email: <input type="text" name="email" size="30" /></label>
            </fieldset>

            <br />

            <fieldset>
                <legend>Ваше мнение:</legend>

                <label>Как вы узнали о нас? 
                    <select name="source">
                        <option value="google">Google</option>
                        <option value="yandex">Яндекс</option>
                        <option value="friends">От друзей</option>
                    </select>
                </label>
                
                <br /><br />

                <p>Посетите ли вы наш сайт снова?<br />
                    <input type="radio" name="visit" value="yes" /> Да
                    <input type="radio" name="visit" value="no" /> Нет
                    <input type="radio" name="visit" value="maybe" /> Возможно
                </p>

                <label>Комментарий:<br />
                    <textarea name="comments" cols="40" rows="4"></textarea>
                </label>

                <br /><br />

                <label>
                    <input type="checkbox" name="subscribe" value="yes" checked="checked" /> Я хочу получать рассылку с новостями сайта
                </label>

                <br /><br />

                <input type="submit" value="Отправить отзыв" />
            </fieldset>

        </form>
    </body>
</html>
